<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,200..900;1,8..60,200..900&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/axios@1.1.2/dist/axios.min.js"></script>
    <link rel="stylesheet" href="src/styles.css" />
    <title>My weather application</title>
  </head>
  <body>
    <div class="weather-app">
      <header>
        <form id="search-form">
          <input
            type="search"
            placeholder="Enter a city.."
            required
            class="search-input"
            id="search-input"
          />
          <input type="submit" value="Search" class="search-button" />
        </form>
      </header>
      <main>
        <div class="current-weather">
          <div>
            <h1 class="current-city" id="current-city">Paris</h1>
            <p class="current-details">
              <span id="time"></span>, <span id="description"></span> <br />
              Humidity: <strong class="humidity" id="humidity"></strong>, Wind:
              <strong class="wind" id="wind"></strong>
            </p>
          </div>
          <div class="current-temperature">
            <div id="icon" class="current-temperature-icon"></div>
            <div
              class="current-temperature-value"
              id="current-temperature"
            ></div>
            <div class="current-temperature-unit">°C</div>
          </div>
        </div>
        <div class="weather-forecast" id="forecast"></div>
      </main>
      <footer>
        <p>
          This project was coded by
          <a
            href="https://github.com/francescabice"
            target="_blank"
            class="franci-link"
          >
            Franci,</a
          >
          is
          <a
            href="https://github.com/francescabice/Project-new"
            target="_blank"
            class="gitHub"
          >
            open-souerced on GitHub</a
          >
          and
          <a
            href="https://tourmaline-biscotti-119032.netlify.app/"
            target="_blank"
            class="netlify"
            >hosted on Netlify</a
          >
        </p>
      </footer>
    </div>
    <script src="src/index.js"></script>
  </body>
</html>
